# aigameengine -- what a push has to keep true (rewritten 2026-11-05, for the engine as it is since the old renderer left).
# Every step is a part of .github/ci.sh, so the same lines run on any Linux machine: bash .github/ci.sh
#
# What it holds: every way the engine is built off Windows compiles and links; five games give the same hashes at odd
# frame pacings (and the sample from another pack format, and with other letters on the screen); online play's ten
# cases on this runner's loopback; and the sample game's hashes don't depend on what was in memory before.
# What it doesn't: the Vulkan build is compiled and linked and never started (a runner has no driver for it), nothing
# here looks at a picture, nothing here is a Raspberry Pi, and nothing is compared with a kept copy of what the engine
# printed before: the engine isn't finished, and that changes with every improvement.
#
# Every step was run from this repository's own files in a Debian 13 container (gcc 14.2) before this was written.
name: checks
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: what the engine links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libvulkan-dev libstb-dev libdrm-dev
          gcc --version | head -1
      - name: every road builds, and every game with no display
        run: bash .github/ci.sh build
      - name: each game gives the same answer at any frame pacing
        run: bash .github/ci.sh steady
      - name: online play, on this machine's loopback
        run: bash .github/ci.sh online
      - name: and whatever was in memory before
        run: bash .github/ci.sh memory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs
          path: out/ci/*.log
          if-no-files-found: ignore
