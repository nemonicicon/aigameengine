# toolchain.lock -- what the engine was last built and checked with, by exact version. anim_bench/toolcheck.py writes it and reads it:
# `toolcheck.py` says what's moved on this machine, `--write` pins it again once the checks hold. A section a machine, a name and a tab and its version a line.
# Every build line also says -std=gnu17 -ffp-contract=off, and that's what a pin is for: the same hashes on every machine, from the same compiler.

